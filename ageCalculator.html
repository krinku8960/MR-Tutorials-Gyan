let areDobDate = document.getElementById("dob_Date");
let areThisButtonClick = document.getElementById("btnClickTocalculate");
const areResultOutput = document.getElementById("Result");

areThisButtonClick.addEventListener("click", function () {

    const today = new Date(areThisCureentDate.value);
    const dob = new Date(areDobDate.value);

    let age = today.getFullYear() - dob.getFullYear();

    const month = today.getMonth() - dob.getMonth();
    // const day = today.getDay() - today.getDay();

    if (
        month < 0 ||
        (month === 0 && today.getDate() < dob.getDate())
    ) {
        age--;
    }

    areResultOutput.innerHTML = `You are ${age} years, ${month} months old.`;
