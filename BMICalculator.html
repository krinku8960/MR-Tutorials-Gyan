<body>
    <div class="outerBox">
        <div class="innerBox">
            <h2>BMI Calculator</h2>
            <label for="weight"> Weight:</label>

            <label for="height">Height :</label>
            <input type="text" id="height" placeholder="Enter height e.g. 5'4">
            <button id="calculate-btn" onclick=" convertHeight()">BMI Calculate</button>
            <p id="result"></p>
        </div>
    </div>

function convertHeight() {
    const weight = Number(document.getElementById("weight").value);
    const heightInput = document.getElementById("height").value;
    const result = document.getElementById("result");

    if (!weight || !heightInput) {
        result.textContent = "Please enter weight and height.";
        return;
    }

    const heightParts = heightInput.replace(/['"]/g, " ").split(/[.\s]+/);

    const feet = Number(heightParts[0]);
    const inches = Number(heightParts[1] || 0);

    const totalInches = feet * 12 + inches;
    const heightMeters = totalInches * 0.0254;
    const bmi = weight / (heightMeters * heightMeters);

    result.textContent = `Your BMI is ${bmi.toFixed(2)}`;
}

document.getElementById("weight").addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
        convertHeight();
    }
});

document.getElementById("height").addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
        convertHeight();
    }
});
