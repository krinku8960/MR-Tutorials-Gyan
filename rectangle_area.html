<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rectangle Area Calculator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#101218;color:#f4f5fb;padding:20px}
.card{width:100%;max-width:390px;background:#1b1e29;border:1px solid #303545;border-radius:20px;padding:28px;box-shadow:0 15px 40px #0006}
h1{font-size:25px;color:#91a0ff;margin-bottom:10px}
.formula{color:#aeb4c8;font-size:14px;line-height:1.5;margin-bottom:22px}
label{display:block;margin:13px 0 7px;color:#d9dced;font-size:14px}
input,select{width:100%;padding:13px;background:#10131b;color:#fff;border:1px solid #3a4053;border-radius:9px;font-size:16px;outline:none}
input:focus,select:focus{border-color:#91a0ff}
button{width:100%;padding:14px;margin-top:20px;border:0;border-radius:10px;background:#6878ff;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{background:#5263e8}
.result{margin-top:18px;padding:15px;background:#11151d;border:1px solid #303545;border-radius:10px;color:#71f0b5;overflow-wrap:anywhere;min-height:50px}
</style>
</head>
<body>
<main class="card">
<h1>Rectangle Area Calculator</h1>
<p class="formula">Area = length × width</p>
<label>Length</label><input id="a" type="number" min="0" step="any" placeholder="Enter length">
<label>Width</label><input id="b" type="number" min="0" step="any" placeholder="Enter width">
<button onclick="calc()">Calculate Area</button>
<div class="result" id="result">Your result will appear here.</div>
</main>
<script>
function show(value){document.getElementById('result').textContent=value}
function calc(){let av=document.getElementById('a').value,bv=document.getElementById('b').value,a=Number(av),b=Number(bv);if(av===''||bv===''||a<0||b<0){show('Enter valid length and width');return}show('Area = '+(a*b)+' square units')}
</script>
</body>
</html>
